# render.yaml — Render deployment blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# This file defines two services:
#   1. cybersentinel-backend  — FastAPI (Python web service)
#   2. cybersentinel-frontend — React/Vite (static site)
#
# To deploy: push this repo to GitHub, then connect it in the Render dashboard
# and Render will detect this file automatically.

services:

  # ── FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: cybersentinel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        # Set this to your deployed frontend URL once you know it.
        # Example: https://cybersentinel-ai.onrender.com
        value: http://localhost:5173

  # ── React / Vite Frontend (Static Site) ─────────────────────────
  - type: web
    name: cybersentinel-frontend
    runtime: static
    rootDir: cybersentinel-ai
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set this to your deployed backend URL once you know it.
        # Example: https://cybersentinel-backend.onrender.com
        value: http://127.0.0.1:8000
    routes:
      # React Router — send all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
